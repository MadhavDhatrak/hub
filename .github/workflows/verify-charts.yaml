name: verify-charts

on:
  pull_request:
    paths:
      - 'extensions/**'
      - '.github/scripts/verify-charts.sh'
      - '.github/workflows/verify-charts.yaml'

  # Catch charts that get yanked/deleted after merge, and allow manual runs.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Referenced OCI charts exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Authenticate to ghcr.io
        # Anonymous pulls of public packages work, but logging in with the
        # workflow token avoids unauthenticated rate limits.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Verify every referenced chart exists at its declared version
        run: bash .github/scripts/verify-charts.sh
